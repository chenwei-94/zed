[package]
name = "inspector_ui"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[features]
# ── RLT 分支改动（保留项）────────────────────────────────────────────────────
# 【为什么加】rlt-dev 自研的元素检查器（需求 FR-APP-022）复用本 crate 的拾取/高亮
#   机制，而发布档（release）也需要可用的检查器；上游只在 `debug_assertions` 下
#   编译本 crate（见 `src/inspector_ui.rs` 顶部说明）。
# 【影响面】默认**关闭** ⇒ 不开 feature 时编译产物与上游一致；显式
#   `--features inspector` 才在 release 中启用。
# 【为何依赖 gpui/inspector】元素的 ID 与构造源码位置由 gpui 侧同名 feature 采集，
#   本 crate 只负责把这些信息渲染成检查器界面。
inspector = ["gpui/inspector"]

[lints]
workspace = true

[lib]
path = "src/inspector_ui.rs"
doctest = false

[dependencies]
anyhow.workspace = true
command_palette_hooks.workspace = true
editor.workspace = true
fuzzy.workspace = true
gpui.workspace = true
language.workspace = true
project.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
theme_settings.workspace = true
ui.workspace = true
util.workspace = true
util_macros.workspace = true
workspace.workspace = true
zed_actions.workspace = true

[dev-dependencies]
fs = { workspace = true, features = ["test-support"] }
futures.workspace = true
gpui = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
paths.workspace = true
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
snippet_provider.workspace = true
theme.workspace = true
workspace = { workspace = true, features = ["test-support"] }
