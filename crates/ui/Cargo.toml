[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
name = "ui"
path = "src/ui.rs"

[dependencies]
chrono.workspace = true
component.workspace = true
documented.workspace = true
gpui.workspace = true
gpui_macros.workspace = true
icons.workspace = true
itertools.workspace = true
log.workspace = true
menu.workspace = true
num-format.workspace = true
schemars.workspace = true
serde.workspace = true
smallvec.workspace = true
strum.workspace = true
theme.workspace = true
ui_macros.workspace = true
web-time.workspace = true
gpui_util.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
theme_settings.workspace = true

[package.metadata.cargo-shear]
ignored = ["log"]

[features]
default = []
# ── RLT 分支改动（保留项）────────────────────────────────────────────────────
# 【为什么加】`StyledExt` 经 `gpui_macros::derive_inspector_reflection` 生成的反射模块
#   （`styled_ext_reflection`）是 release 版元素检查器列出元素样式的依据；上游只在
#   `debug_assertions` 下生成它（见 `src/traits/styled_ext.rs` 的门控）。
# 【影响面】默认**关闭**；只有显式 `--features inspector` 才在 release 中生成反射模块。
inspector = ["gpui_macros/inspector"]
