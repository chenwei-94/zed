name: Sync Upstream Zed

# ── 抓取规则（2026-09-22 由项目所有者确立：只浅抓最新源码，不拉全部 git 历史）──
#   ① 只抓 upstream 的 main 一个分支（裸 `git fetch upstream` 会抓回上游 1684 个分支）
#   ② 一律 --no-tags（上游有 548 个标签，本仓构建路径不依赖任何标签）
#   ③ --shallow-since=<本仓 main 尖的日期>：只抓「尖之后」的提交
#   ④ 禁止 --depth=1：实测它会把上游尖标记为「无父提交」，导致算不出合并基点、合并直接失败
# 本地同口径脚本：rlt-dev 仓 `生态/中文本地化/脚本/同步上游.sh`

on:
  schedule:
    # 每天 UTC 0:00（北京时间 8:00）执行
    - cron: '0 0 * * *'
  # 也支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork（浅克隆，只要最新源码）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: 添加上游并浅抓其 main
        run: |
          git remote add upstream https://github.com/zed-industries/zed.git
          SINCE="$(git show -s --format=%cI HEAD)"
          # 只抓 main、不抓标签、只抓本仓 main 尖之后的提交
          git fetch --no-tags --shallow-since="$SINCE" upstream main

      - name: 仅快进同步 main
        run: |
          # main 是「上游镜像」：只允许快进。若已分叉（例如带了自有提交），
          # 明确报错而不是悄悄改写历史 —— 自有提交（汉化等）走 汉化-zh-CN 分支。
          if git merge --ff-only upstream/main; then
            git push origin main
          else
            echo "::error::main 已分叉，无法快进同步。请把自有提交放到 汉化-zh-CN 分支后再同步。"
            exit 1
          fi
